<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>position 웹요소의 위치 지정하기</title>
        <style>
            .box {
                position: absolute;
                top: 0;
                left: 0;
                width: 200px;
                height: 200px;
                background-color: tomato;
            }
            .contents {
                position: relative;
                width: 500px;
                height: 400px;
                background-color: aqua;
            }
            .section {
                position: relative;
                width: 400px;
                height: 300px;
                background-color: yellowgreen;
            }
            .gotop {
                position: fixed;
                right: 0;
                bottom: 0;
                width: 100px;
                border-radius: 50%;
                line-height: 100px;
                text-align: center;
                height: 100px;
                background-color: violet;
            }
            .header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                line-height: 80px;
                background-color: cadetblue;
                z-index: 9999;
            }
            .wrap {
                position: relative;
                height: 100px;
                width: 100px;

                background-color: yellow;
            }
            .wrap p {
                width: 37px;
                position: absolute;
                left: 45px;
                top: 20px;
                background-color: aliceblue;
            }
        </style>
    </head>
    <body>
        <div class="header">상단</div>
        <div class="contents">
            <div class="box"></div>
        </div>
        <div class="section">
            <div class="box"></div>
        </div>
        <div class="gotop">위로가기†</div>
        <div class="wrap">
            <p>new</p>
        </div>
    </body>
</html>
